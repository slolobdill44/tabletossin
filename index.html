<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Table Tossin'</title>
  </head>

  <link href="https://fonts.googleapis.com/css?family=Dosis:700|Bungee+Inline" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <script src="lib/matter.js" type="text/javascript"></script>
  <script src="lib/decomp.min.js" type="text/javascript"></script>
  <script src="lib/hamhuckin.js" type="text/javascript"></script>

  <body id="game-screen" onload="gameStart()">
    <header id="info-nav">
      <p>
        <strong class="title-text">Table Tossin'</strong>
        <a href="https://github.com/slolobdill44"><img class="github-img" src="assets/github.png" /></a>
      </p>
    </header>

    <div id="canvas-wrapper">
    <div class="shots-text">
      <span class="shots-label">Tosses Left:</span><div class="shots-number">5</div>
      <div class="bonus-text">
        <div class="bonus-label">Bonus!
          <div class="bonus-timer">Next shot in: <span class="bonus-timer-value">0.00</span></div>
        </div>
        <div class="bonus-explainer">Shoot until any object is knocked off</div>
      </div>
    </div>
    <div class="score-text">
      Score:<div class="score-number">0</div>
    </div>
    <div class="welcome-badge">WELCOME</div>
    <div class="stack-height"></div>

    <div id='title-screen'>
      <button id='start-game-btn' type='button'>Start Game</button>
    </div>

    <div id='level-intro'>
      <div class='level-intro-content'>
        <div class='level-intro-title'>Level 1</div>
        <div class='level-intro-label'>Hamburger</div>
        <img class='level-intro-img' src='' alt=''>
        <div class='level-intro-score'></div>
      </div>
    </div>

    <div id='bonus-end-screen'>
      <div class='bonus-end-content'>
        <div class='bonus-end-title'>Bonus Ended</div>
        <div class='bonus-end-reason'>An object fell off</div>
        <div class='bonus-end-score'>Level score: 0</div>
      </div>
    </div>

    <div id='ending-screen'>
      <div class='ending-screen-text'>
        <div class='game-over-text'>Game Complete!</div>
        <div class='ending-score-text'>Your final score: <div class='score-number'>0</div></div>
        <div class='high-score-text'>Session High Score: <div class='high-score-number'>0</div></div>
        <div class='game-over-text' id='restart-instructions'>Click anywhere to restart</div>
      </div>
    </div>

    </div><!-- /canvas-wrapper -->

    <script>
      if (window.matchMedia('(pointer: coarse)').matches) {
        document.getElementById('restart-instructions').textContent = 'Tap anywhere to restart';
      }
    </script>
  </body>


</html>
